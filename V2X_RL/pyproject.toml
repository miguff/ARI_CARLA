[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "v2x-rl"
version = "0.1.0"
description = "RL for V2X-assisted intersection negotiation with a cyclist in CARLA"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.6,<3",
    "torch>=2.2",
    "scikit-learn>=1.3",
    "opencv-python>=4.5",
    "PyYAML>=6.0",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["v2x_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["carla: requires a running CARLA server"]
filterwarnings = ["ignore::DeprecationWarning"]
